services:
  mysql:
    image: docker.1ms.run/mysql:8.3.0
    container_name: db-mp-local
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: we-mp-rss-redis-local
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: we-mp-rss-singbox-local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SINGBOX_INBOUND_PORT: 7890
      SINGBOX_LOG_LEVEL: info
    entrypoint:
      - /bin/sh
      - /etc/sing-box/run-singbox.sh
    volumes:
      - ./singbox/run-singbox.sh:/etc/sing-box/run-singbox.sh:ro

  we-mp-rss:
    build:
      context: ..
      dockerfile: Dockerfile
    image: we-mp-rss:local
    container_name: we-mp-rss-local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB: mysql+pymysql://rss_user:pass123456@db-mp-local/we_mp_rss?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      PROXY_HTTP_URL: http://singbox:7890
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      singbox:
        condition: service_started

volumes:
  db_data:
  redis_data:
